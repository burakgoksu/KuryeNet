server.port=${PORT:8585}

api.base-path=${API_BASE_PATH:/api}
api.versioned-base-path=${API_VERSIONED_BASE_PATH:/api/v1}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/KuryeNet}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.show-sql=true
spring.jpa.properties.javax.persistence.validation.mode = none
spring.mvc.pathmatch.matching-strategy=ant-path-matcher 

spring.cache.type=none
spring.data.redis.host=localhost
spring.data.redis.port=6379

security.jwt.secret=${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
security.jwt.issuer=${JWT_ISSUER:kurye-net}
security.jwt.audience=${JWT_AUDIENCE:kurye-net-api}
security.jwt.access-token-minutes=${JWT_ACCESS_MINUTES:1440}
security.jwt.refresh-token-days=${JWT_REFRESH_DAYS:7}
security.jwt.clock-skew-seconds=${JWT_CLOCK_SKEW_SECONDS:30}

security.login.max-attempts=${SECURITY_LOGIN_MAX_ATTEMPTS:5}
security.login.lock-minutes=${SECURITY_LOGIN_LOCK_MINUTES:15}

security.cors.allowed-origins=${SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:8081}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState
management.tracing.enabled=true
management.tracing.sampling.probability=0.1
management.metrics.tags.application=kuryenet
management.metrics.distribution.percentiles-histogram.http.server.requests=true

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} traceId=%X{traceId} spanId=%X{spanId} correlationId=%X{correlationId} - %msg%n

management.health.redis.enabled=false
management.health.rabbit.enabled=false

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

app.messaging.enabled=false
app.messaging.order-exchange=order.exchange
app.messaging.order-queue=order.events
app.messaging.order-routing-key=order.events

resilience4j.circuitbreaker.instances.googleMaps.slidingWindowSize=10
resilience4j.circuitbreaker.instances.googleMaps.failureRateThreshold=50
resilience4j.circuitbreaker.instances.googleMaps.waitDurationInOpenState=30s
resilience4j.retry.instances.googleMaps.maxAttempts=3
resilience4j.retry.instances.googleMaps.waitDuration=500ms

resilience4j.circuitbreaker.instances.openWeather.slidingWindowSize=10
resilience4j.circuitbreaker.instances.openWeather.failureRateThreshold=50
resilience4j.circuitbreaker.instances.openWeather.waitDurationInOpenState=30s
resilience4j.retry.instances.openWeather.maxAttempts=3
resilience4j.retry.instances.openWeather.waitDuration=500ms

resilience4j.circuitbreaker.instances.aiModel.slidingWindowSize=10
resilience4j.circuitbreaker.instances.aiModel.failureRateThreshold=50
resilience4j.circuitbreaker.instances.aiModel.waitDurationInOpenState=30s
resilience4j.retry.instances.aiModel.maxAttempts=3
resilience4j.retry.instances.aiModel.waitDuration=500ms
